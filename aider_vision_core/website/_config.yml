title: Aider Vision Core
description: Headless Aider engine fork — docs for install, HTTP API, and git workspaces.
theme: just-the-docs
url: ""

# Analytics configuration
analytics:
  enabled: false
  posthog_key: 'phc_99T7muzafUMMZX15H8XePbMSreEUzahHbtWjy3l5Qbv'
  posthog_host: 'https://us.i.posthog.com'

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: "README.md"
      type: "pages"
    values:
      description: "Aider Vision Core — headless engine documentation"

exclude:
  - "tmp*"
  - "**/tmp*"
  - OLD
  - "**/OLD/**"
  - "OLD/**"
  - vendor
  - feed.xml
  - blog
  - _posts

aux_links:
  "Aider Vision":
    - "https://aider-vision.digitaldefiance.org/"
  "Upstream Aider":
    - "https://aider.chat/"
  "GitHub (fork)":
    - "https://github.com/Digital-Defiance/aider-vision-core"

nav_external_links:
  - title: "Aider Vision"
    url: "https://aider-vision.digitaldefiance.org/"
  - title: "aider.chat"
    url: "https://aider.chat/"
  - title: "GitHub (fork)"
    url: "https://github.com/Digital-Defiance/aider-vision-core"

repository: Digital-Defiance/aider-vision-core

callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: yellow

kramdown:
  syntax_highlighter_opts:
    css_class: highlight

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
